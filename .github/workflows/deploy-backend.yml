name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "back/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/apps/fridge-recipe
            git pull origin master
            cd back
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f

      - name: Health check
        run: |
          sleep 10
          for i in 1 2 3; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://recipe-api.eupori.dev/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying..."
            sleep 5
          done
          echo "Health check failed after 3 attempts"
          exit 1
